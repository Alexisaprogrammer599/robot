<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Companion Face & Gestures</title>
  
  <!-- TensorFlow.js and COCO-SSD for Object Outlines -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  
  <!-- MediaPipe Tasks Vision for Hand Gesture Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_bundle.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0f1015;
      --card: #181920;
      --accent: #00e5ff;
      --text: #e1e1e6;
      --border: #2a2b36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    @media (min-width: 768px) {
      body {
        display: grid;
        grid-template-columns: 360px 1fr;
      }
    }

    /* FULLSCREEN OVERLAY UI WHEN ACTIVE */
    body.ai-active sidebar,
    body.ai-active main > h2 {
      display: none !important;
    }

    body.ai-active {
      display: block !important;
      background: #ffffff !important;
    }

    body.ai-active main {
      padding: 0 !important;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    body.ai-active .face-avatar {
      display: flex !important;
      background: #ffffff !important;
    }

    sidebar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      max-height: 50vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    @media (min-width: 768px) {
      sidebar {
        border-right: 1px solid var(--border);
        border-bottom: none;
        max-height: 100vh;
      }
    }
    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      position: relative;
    }
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas#overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .face-avatar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .face-avatar img {
      max-width: 70vmin;
      max-height: 70vmin;
      object-fit: contain;
    }
    #chat-log {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    body.ai-active #chat-log {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      height: 70vh;
      z-index: 20;
      background: rgba(24, 25, 32, 0.95);
      display: none;
    }
    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 0.9em;
      line-height: 1.4;
      word-break: break-word;
    }
    .user { background: #2b384e; align-self: flex-end; }
    .bot { background: #0e4e43; align-self: flex-start; }
    .sys { background: #3c2a15; align-self: center; font-size: 0.8em; text-align: center; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    input, select, button {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #101116;
      color: #fff;
      font-size: 0.85em;
      width: 100%;
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button.danger {
      background: #ff5252;
      color: #fff;
    }
    .status-bar {
      font-size: 0.75em;
      color: #a0a0b0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 0;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
    }
    .karma-badge {
      color: #00e5ff;
      font-weight: bold;
    }
    
    /* Muted Text Overlay */
    #muted-indicator {
      display: none;
      position: absolute;
      top: 15px;
      right: 15px;
      color: #ff3b30;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.05);
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 30;
      user-select: none;
    }
  </style>
</head>
<body>

  <sidebar>
    <div class="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="snapshot" style="display:none;"></canvas>
    </div>

    <div class="status-bar">
      <div class="status-row">
        <span id="mic-status">Mic: Off</span>
        <span id="vision-status">Vision: Loading...</span>
      </div>
      <div class="status-row">
        <span>Emotion: <span id="emotion-val" class="karma-badge">Neutral (0)</span></span>
        <span>Karma: <span id="karma-val" class="karma-badge">0</span></span>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn">⚡ Activate AI Companion</button>
      
      <label>Camera Source:</label>
      <select id="camera-select"></select>

      <label>AI Provider & Model:</label>
      <select id="api-provider">
        <option value="gemini-3.6-flash">Google Gemini (3.6 Flash)</option>
        <option value="gemini-2.5-flash">Google Gemini (2.5 Flash)</option>
        <option value="gemini-1.5-flash">Google Gemini (1.5 Flash)</option>
        <option value="openai">OpenAI (GPT-4o mini)</option>
      </select>

      <input type="password" id="api-key" placeholder="Enter API Key...">

      <label>Bot Personality (Profile):</label>
      <select id="bot-profile" onchange="updateProfile()">
        <option value="normal">Interactive Companion</option>
        <option value="detector">Safety Inspector</option>
        <option value="custom">Custom System Prompt</option>
      </select>
      <input type="text" id="custom-prompt" placeholder="Custom Instructions..." style="display:none;">

      <label>Save Slot Manager:</label>
      <div class="row">
        <select id="save-slots"></select>
        <button id="new-slot-btn" style="width: 40%;">New</button>
      </div>
      <button id="delete-slot-btn" class="danger">Delete Slot</button>

      <label>TTS Audio Settings:</label>
      <select id="tts-engine" onchange="toggleTtsFields()">
        <option value="web">Browser Native TTS</option>
        <option value="fish">Fish Audio API</option>
      </select>

      <div id="fish-tts-config" style="display:none; flex-direction:column; gap:6px;">
        <input type="password" id="fish-key" placeholder="Fish Audio API Key">
        <input type="text" id="fish-model-id" placeholder="Model ID / Reference ID">
      </div>
    </div>
  </sidebar>

  <main>
    <h2>Robot Vision & Speech Log</h2>
    
    <!-- AI Animated Display Face -->
    <div class="face-avatar" id="face-avatar">
      <img id="face-image" src="faces/1.png" alt="AI Face">
    </div>

    <div id="muted-indicator">MUTED</div>
    <div id="chat-log"></div>
  </main>

  <script>
    const video = document.getElementById('webcam');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    const canvas = document.getElementById('snapshot');
    const cameraSelect = document.getElementById('camera-select');
    const chatLog = document.getElementById('chat-log');
    const startBtn = document.getElementById('start-btn');
    const apiKeyInput = document.getElementById('api-key');
    const apiProvider = document.getElementById('api-provider');
    const botProfile = document.getElementById('bot-profile');
    const customPromptInput = document.getElementById('custom-prompt');
    const saveSlots = document.getElementById('save-slots');
    const ttsEngine = document.getElementById('tts-engine');
    const fishKey = document.getElementById('fish-key');
    const fishModelId = document.getElementById('fish-model-id');
    const faceAvatar = document.getElementById('face-avatar');
    const faceImage = document.getElementById('face-image');
    const mutedIndicator = document.getElementById('muted-indicator');

    let currentStream = null;
    let recognition = null;
    let isListening = false;
    let isSpeaking = false;
    let isMuted = false;
    let activeSlot = 'default_slot';
    let chatHistory = {};
    
    let objectDetectorModel = null;
    let gestureRecognizer = null;
    let detectedObjectsList = [];
    let detectedGesturesList = [];
    let idleInterval = null;

    let emotionScore = 0;
    let karmaScore = 0;
    let currentPose = 'neutral';
    let mouthFlapInterval = null;

    const FACE_MAP = {
      neutral: { closed: "faces/1.png", open: "faces/2.png" },
      bored:   { closed: "faces/3.png", open: "faces/4.png" },
      angry:   { closed: "faces/5.png", open: "faces/6.png" },
      happy:   { closed: "faces/7.png", open: "faces/8.png" }
    };

    const PROFILES = {
      normal: "You are an expressive AI robot with an animated white-background screen face. You observe your surroundings, human gestures, and object placement.\n\n" +
              "OUTPUT FORMAT (Strict JSON Only):\n" +
              "{\n" +
              '  "speech": "Response speech text",\n' +
              '  "pose": "neutral" | "bored" | "angry" | "happy",\n' +
              '  "emotion_change": (-20 to +20),\n' +
              '  "karma_change": (-20 to +20)\n' +
              "}",

      detector: "You are a Safety Inspector Bot monitoring objects and gestures.\n\n" +
                "OUTPUT FORMAT (Strict JSON Only):\n" +
                "{\n" +
                '  "speech": "Inspection report",\n' +
                '  "pose": "neutral" | "bored" | "angry" | "happy",\n' +
                '  "emotion_change": 0,\n' +
                '  "karma_change": 0\n' +
                "}"
    };

    async function init() {
      loadAllSaves();
      populateCameraList();
      toggleTtsFields();
      initSpeechRecognition();
      loadDetectorModels();
      setupKeybinds();
    }

    function setupKeybinds() {
      window.addEventListener('keydown', (e) => {
        if (!document.body.classList.contains('ai-active')) return;

        switch (e.key) {
          case '1':
            chatLog.style.display = (chatLog.style.display === 'flex' || chatLog.style.display === 'block') ? 'none' : 'flex';
            break;

          case '2':
            deactivateAI();
            break;

          case '3':
            toggleMute();
            break;

          case '4':
            toggleFullscreen();
            break;
        }
      });
    }

    function toggleMute() {
      isMuted = !isMuted;
      mutedIndicator.style.display = isMuted ? 'block' : 'none';
      
      if (isMuted) {
        if (recognition) try { recognition.stop(); } catch(e){}
        document.getElementById('mic-status').innerText = 'Mic: Muted';
      } else {
        if (isListening && !isSpeaking) try { recognition.start(); } catch(e){}
        document.getElementById('mic-status').innerText = 'Mic: Active';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.error(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    async function loadDetectorModels() {
      try {
        objectDetectorModel = await cocoSsd.load();
        
        const { GestureRecognizer, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_bundle.js');
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');
        gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2
        });

        document.getElementById('vision-status').innerText = 'Vision: Ready';
        startDetectionLoop();
      } catch(e) {
        console.error("Vision model initialization error", e);
        document.getElementById('vision-status').innerText = 'Vision: Basic Mode';
      }
    }

    function startDetectionLoop() {
      setInterval(async () => {
        if (!video.videoWidth) return;
        
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

        if (objectDetectorModel) {
          const predictions = await objectDetectorModel.detect(video);
          detectedObjectsList = predictions.map(p => `${p.class} (${Math.round(p.score * 100)}%)`);
          
          predictions.forEach(p => {
            const [x, y, w, h] = p.bbox;
            overlayCtx.strokeStyle = "#00e5ff";
            overlayCtx.lineWidth = 2;
            overlayCtx.strokeRect(x, y, w, h);
          });
        }

        if (gestureRecognizer && video.currentTime > 0) {
          const gestureResults = gestureRecognizer.recognizeForVideo(video, Date.now());
          detectedGesturesList = [];
          
          if (gestureResults.gestures.length > 0) {
            gestureResults.gestures.forEach((gestures, idx) => {
              const name = gestures[0].categoryName;
              const score = Math.round(gestures[0].score * 100);
              if (name !== 'Unrecognized') {
                detectedGesturesList.push(`Hand ${idx + 1}: ${name} (${score}%)`);
              }
            });
          }
        }
      }, 150);
    }

    function updateFaceDisplay(openMouth = false) {
      const poses = FACE_MAP[currentPose] || FACE_MAP.neutral;
      faceImage.src = openMouth ? poses.open : poses.closed;
    }

    function startMouthFlap() {
      stopMouthFlap();
      let state = false;
      mouthFlapInterval = setInterval(() => {
        state = !state;
        updateFaceDisplay(state);
      }, 160);
    }

    function stopMouthFlap() {
      if (mouthFlapInterval) clearInterval(mouthFlapInterval);
      updateFaceDisplay(false);
    }

    function updateStatsUI() {
      document.getElementById('karma-val').innerText = karmaScore;
      let label = "Neutral";
      if (emotionScore > 30) label = "Happy";
      else if (emotionScore < -30) label = "Angry";
      else if (currentPose === 'bored') label = "Bored";

      document.getElementById('emotion-val').innerText = `${label} (${emotionScore})`;
    }

    function loadAllSaves() {
      const raw = localStorage.getItem('ai_robot_saves');
      chatHistory = raw ? JSON.parse(raw) : { 'default_slot': [] };
      renderSlotDropdown();
      renderChat();
    }

    function saveAllSaves() {
      localStorage.setItem('ai_robot_saves', JSON.stringify(chatHistory));
    }

    function renderSlotDropdown() {
      saveSlots.innerHTML = Object.keys(chatHistory).map(s => 
        `<option value="${s}" ${s === activeSlot ? 'selected' : ''}>${s}</option>`
      ).join('');
    }

    saveSlots.onchange = () => {
      activeSlot = saveSlots.value;
      renderChat();
    };

    document.getElementById('new-slot-btn').onclick = () => {
      const name = prompt("Enter new Save Slot Name:") || `slot_${Date.now()}`;
      if (!chatHistory[name]) chatHistory[name] = [];
      activeSlot = name;
      saveAllSaves();
      renderSlotDropdown();
      renderChat();
    };

    document.getElementById('delete-slot-btn').onclick = () => {
      if (Object.keys(chatHistory).length <= 1) return alert("Must keep at least one save slot.");
      delete chatHistory[activeSlot];
      activeSlot = Object.keys(chatHistory)[0];
      saveAllSaves();
      renderSlotDropdown();
      renderChat();
    };

    function logMessage(role, text) {
      if (!chatHistory[activeSlot]) chatHistory[activeSlot] = [];
      chatHistory[activeSlot].push({ role, text, time: new Date().toLocaleTimeString() });
      saveAllSaves();
      renderChat();
    }

    function renderChat() {
      const msgs = chatHistory[activeSlot] || [];
      chatLog.innerHTML = msgs.map(m => 
        `<div class="msg ${m.role}"><b>${m.role.toUpperCase()}:</b> ${m.text}</div>`
      ).join('');
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function populateCameraList() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        
        cameraSelect.innerHTML = videoDevices.map((d, i) => 
          `<option value="${d.deviceId}">${d.label || `Camera ${i + 1}`}</option>`
        ).join('');

        if (videoDevices.length > 0) startCamera(videoDevices[0].deviceId);
      } catch(e) {
        startCamera(null);
      }
    }

    cameraSelect.onchange = () => startCamera(cameraSelect.value);

    async function startCamera(deviceId) {
      if (currentStream) currentStream.getTracks().forEach(track => track.stop());
      
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "user" }
        });
        video.srcObject = currentStream;
      } catch (err) {
        console.warn("Camera fallback applied");
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        if (!isMuted) document.getElementById('mic-status').innerText = 'Mic: Active';
      };

      recognition.onresult = async (event) => {
        if (isSpeaking || isMuted) return;

        const text = event.results[event.results.length - 1][0].transcript.trim();
        if (!text) return;

        logMessage('user', text);
        await processTurn(text);
      };

      recognition.onerror = (e) => {
        console.warn("Speech recognition error", e);
      };

      recognition.onend = () => {
        if (isListening && !isSpeaking && !isMuted) {
          try { recognition.start(); } catch(e){}
        }
      };
    }

    function startSpontaneousTalkingLoop() {
      if (idleInterval) clearInterval(idleInterval);
      
      idleInterval = setInterval(() => {
        if (isListening && !isSpeaking && !isMuted) {
          processTurn("[IDLE PROMPT: Observe the environment, gestures, or human action]");
        }
      }, 20000);
    }

    function pauseListening() {
      if (recognition && isListening) {
        try { recognition.stop(); } catch(e){}
      }
    }

    function resumeListening() {
      if (recognition && isListening && !isMuted) {
        try { recognition.start(); } catch(e){}
      }
    }

    function captureFrame() {
      if (!video.videoWidth) return null;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
    }

    function getSystemPrompt() {
      return botProfile.value === 'custom' 
        ? (customPromptInput.value || PROFILES.normal) 
        : PROFILES[botProfile.value];
    }

    function updateProfile() {
      customPromptInput.style.display = botProfile.value === 'custom' ? 'block' : 'none';
    }

    async function processTurn(userText) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        speak("Missing API Key.");
        return;
      }

      const base64Img = captureFrame();
      const sysPrompt = getSystemPrompt();
      const selectedModel = apiProvider.value;

      const visionContext = [];
      if (detectedObjectsList.length) visionContext.push(`Detected Objects: [${detectedObjectsList.join(', ')}]`);
      if (detectedGesturesList.length) visionContext.push(`Detected Gestures: [${detectedGesturesList.join(', ')}]`);
      
      const detectedContext = visionContext.join('\n');
      const currentSlotHistory = chatHistory[activeSlot] || [];

      try {
        let rawResponse = "";
        
        if (selectedModel === 'openai') {
          const apiMessages = [{ role: "system", content: sysPrompt }];

          currentSlotHistory.forEach(item => {
            if (item.role === 'user' || item.role === 'bot') {
              apiMessages.push({
                role: item.role === 'bot' ? 'assistant' : 'user',
                content: item.text
              });
            }
          });

          const lastIndex = apiMessages.length - 1;
          if (base64Img && lastIndex >= 0 && apiMessages[lastIndex].role === 'user') {
            apiMessages[lastIndex].content = [
              { type: "text", text: `${userText}\n\n${detectedContext}` },
              { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Img}` } }
            ];
          }

          const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: "gpt-4o-mini",
              messages: apiMessages,
              response_format: { type: "json_object" }
            })
          });

          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          rawResponse = data.choices[0].message.content;

        } else {
          const contents = [];

          currentSlotHistory.forEach(item => {
            if (item.role === 'user' || item.role === 'bot') {
              contents.push({
                role: item.role === 'bot' ? 'model' : 'user',
                parts: [{ text: item.text }]
              });
            }
          });

          const activeUserParts = [{ text: `${sysPrompt}\n${detectedContext}\nUser input: "${userText}"` }];
          if (base64Img) activeUserParts.push({ inline_data: { mime_type: "image/jpeg", data: base64Img } });

          if (contents.length > 0 && contents[contents.length - 1].role === 'user') {
            contents[contents.length - 1].parts = activeUserParts;
          } else {
            contents.push({ role: 'user', parts: activeUserParts });
          }

          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents })
          });
          
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          rawResponse = data.candidates[0].content.parts[0].text;
        }

        let parsedPayload = {};
        try {
          parsedPayload = JSON.parse(rawResponse.replace(/```json|```/g, '').trim());
        } catch(e) {
          parsedPayload = { speech: rawResponse, pose: 'neutral', emotion_change: 0, karma_change: 0 };
        }

        emotionScore = Math.min(100, Math.max(-100, emotionScore + (parsedPayload.emotion_change || 0)));
        karmaScore = Math.min(100, Math.max(-100, karmaScore + (parsedPayload.karma_change || 0)));
        currentPose = parsedPayload.pose || 'neutral';
        
        updateStatsUI();
        updateFaceDisplay(false);

        const speechOutput = parsedPayload.speech || rawResponse;
        logMessage('bot', speechOutput);
        await speak(speechOutput);

      } catch (err) {
        console.error("API Error Detail:", err);
        logMessage('sys', `API Error: ${err.message}`);
      }
    }

    function toggleTtsFields() {
      document.getElementById('fish-tts-config').style.display = 
        ttsEngine.value === 'fish' ? 'flex' : 'none';
    }

    async function speak(text) {
      isSpeaking = true;
      pauseListening();
      startMouthFlap();

      const finishSpeaking = (resolveFunc) => {
        stopMouthFlap();
        isSpeaking = false;
        resumeListening();
        resolveFunc();
      };

      if (ttsEngine.value === 'fish') {
        const key = fishKey.value.trim();
        const modelId = fishModelId.value.trim();

        if (key && modelId) {
          try {
            const res = await fetch("https://api.fish.audio/v1/tts", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${key}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                text: text,
                reference_id: modelId,
                format: "mp3"
              })
            });

            if (!res.ok) throw new Error(`Fish Audio Error: ${res.statusText}`);

            const blob = await res.blob();
            const audioUrl = URL.createObjectURL(blob);
            const audio = new Audio(audioUrl);

            return new Promise((resolve) => {
              audio.onended = () => finishSpeaking(resolve);
              audio.onerror = () => finishSpeaking(resolve);
              audio.play();
            });
          } catch(e) {
            console.error("Fish Audio Failed:", e);
          }
        }
      }

      return new Promise((resolve) => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => finishSpeaking(resolve);
        utterance.onerror = () => finishSpeaking(resolve);
        window.speechSynthesis.speak(utterance);
      });
    }

    function activateAI() {
      isListening = true;
      document.body.classList.add('ai-active');
      
      if (recognition && !isSpeaking && !isMuted) {
        try { recognition.start(); } catch(e){}
      }
      
      startSpontaneousTalkingLoop();
      startBtn.innerText = "🛑 Deactivate Companion";
      startBtn.style.background = "#ff5252";
      startBtn.style.color = "#fff";
    }

    function deactivateAI() {
      isListening = false;
      document.body.classList.remove('ai-active');
      chatLog.style.display = '';
      
      if (idleInterval) clearInterval(idleInterval);
      
      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }

      startBtn.innerText = "⚡ Activate AI Companion";
      startBtn.style.background = "var(--accent)";
      startBtn.style.color = "#000";
      document.getElementById('mic-status').innerText = 'Mic: Off';
    }

    startBtn.onclick = () => {
      if (!isListening) {
        activateAI();
      } else {
        deactivateAI();
      }
    };

    window.onload = init;
  </script>
</body>
</html>
